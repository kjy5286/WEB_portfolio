# main 브랜치가 바뀌면 사이트를 빌드해 GitHub Pages(https://kjy5286.github.io)에 배포합니다.
# 저장소 Settings → Pages → Build and deployment → Source를 "GitHub Actions"로 설정해야 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # 공유 미리보기(og:image)·canonical·sitemap에 쓰이는 사이트 주소
          SITE_URL: https://kjy5286.github.io

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
